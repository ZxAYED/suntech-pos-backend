services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: '3001'
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/suntech_pos?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: suntech_pos
    volumes:
      - suntech_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d suntech_pos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  suntech_local_pgdata:
